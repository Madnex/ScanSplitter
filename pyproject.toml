[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scansplitter"
version = "0.7.0"
description = "Automatically detect, split, and rotate multiple photos from scanned images"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
keywords = ["scanner", "photos", "split", "crop", "rotate", "opencv", "image-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "piexif>=1.1.3",
    "onnxruntime>=1.30.0",
    "keyring>=25.7.0",
]

[project.urls]
Homepage = "https://github.com/madnex/scansplitter"
Repository = "https://github.com/madnex/scansplitter"
Issues = "https://github.com/madnex/scansplitter/issues"

[project.scripts]
scansplitter = "scansplitter.cli:main"

[tool.setuptools.package-data]
scansplitter = ["static/**/*"]

[tool.uv]
package = true

[tool.uv.sources]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# onnxruntime is imported lazily; the module-level string annotations that
# reference it trip F821 even though they are valid at runtime.
"src/scansplitter/detector.py" = ["F821"]
